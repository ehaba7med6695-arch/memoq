<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>memoQ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;700&display=swap">
<style>
/* Layout: right-hand navigation rail + working area (RTL); data persists in IndexedDB on the viewer's device. Quiet teal-slate palette, amber reserved for error values. */
:root{
  --bg:#eff4f4; --surface:#ffffff; --surface-2:#f5f9f9; --fg:#12232b; --muted:#566b72; --line:#d7e1e3;
  --accent:#0b6e6e; --accent-fg:#ffffff; --accent-soft:#d9eeed;
  --warn:#9a5b00; --warn-soft:#fbeed6; --bad:#b42318; --bad-soft:#fbe4e1; --good:#17754a; --good-soft:#dcf1e6;
  --f-display:'Reem Kufi','IBM Plex Sans Arabic',Tahoma,sans-serif;
  --f-body:'IBM Plex Sans Arabic',Tahoma,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1a1f; --surface:#14252b; --surface-2:#192d34; --fg:#e5eef0; --muted:#93a9b0; --line:#27393f;
  --accent:#4fc3bd; --accent-fg:#06201f; --accent-soft:#16393a;
  --warn:#f0b35a; --warn-soft:#3a2b12; --bad:#ff8a7d; --bad-soft:#3d1c19; --good:#5fd49a; --good-soft:#12352599;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1a1f; --surface:#14252b; --surface-2:#192d34; --fg:#e5eef0; --muted:#93a9b0; --line:#27393f;
  --accent:#4fc3bd; --accent-fg:#06201f; --accent-soft:#16393a;
  --warn:#f0b35a; --warn-soft:#3a2b12; --bad:#ff8a7d; --bad-soft:#3d1c19; --good:#5fd49a; --good-soft:#12352599;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.7}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;font-weight:700}
h1{font-size:1.6rem} h2{font-size:1.2rem} h3{font-size:1.05rem}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding-block:24px}
.login-card{width:min(440px,100%);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:28px;display:grid;gap:18px}
.brand{font-family:var(--f-display);font-size:2rem;font-weight:700;letter-spacing:.5px;color:var(--accent);direction:ltr;text-align:right}
.brand b{color:var(--fg)}
.field{display:grid;gap:6px}
.field label{font-weight:500;font-size:.9rem}
.inp{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:9px 12px}
.inp:focus{border-color:var(--accent)}
.btn{background:var(--accent);color:var(--accent-fg);border:1px solid var(--accent);border-radius:6px;padding:8px 16px;font-weight:600}
.btn:hover{filter:brightness(1.07)}
.btn.sec{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.sec:hover{background:var(--surface-2)}
.btn.sm{padding:4px 10px;font-size:.85rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.demo-hint{font-size:.85rem;background:var(--surface-2);border:1px dashed var(--line);border-radius:6px;padding:10px 12px;display:grid;gap:8px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* shell */
.shell{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}
.rail{background:var(--surface);border-inline-start:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;align-self:start}
.rail nav{display:grid;gap:4px}
.nav-btn{background:none;border:0;text-align:start;padding:9px 12px;border-radius:6px;color:var(--muted);font-weight:500}
.nav-btn:hover{background:var(--surface-2);color:var(--fg)}
.nav-btn.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.who{margin-top:auto;font-size:.85rem;display:grid;gap:8px;border-top:1px solid var(--line);padding-top:14px}
.main{padding-block:24px 48px;display:grid;gap:18px;align-content:start;min-width:0}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:8px 12px;font-size:.88rem}
.head{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:end}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:grid;gap:12px;min-width:0}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px}
.stat .v{font-family:var(--f-display);font-size:1.9rem;font-weight:700;line-height:1.2}
.stat .l{color:var(--muted);font-size:.85rem}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
.scroll{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{text-align:start;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.82rem;color:var(--muted);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:0}
.pill{display:inline-block;padding:1px 10px;border-radius:99px;font-size:.8rem;font-weight:600;white-space:nowrap}
.p-new{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.p-assigned{background:var(--accent-soft);color:var(--accent)}
.p-done,.p-good{background:var(--good-soft);color:var(--good)}
.p-mid{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:minmax(110px,170px) minmax(0,1fr) 54px;gap:10px;align-items:center;font-size:.9rem}
.bar .t{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar .t i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.w .t i{background:var(--warn)}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.filters .field{min-width:140px}
.drop{border:1.5px dashed var(--line);border-radius:8px;padding:16px;display:grid;gap:8px;background:var(--surface-2)}
.cols{display:flex;flex-wrap:wrap;gap:6px}
.cols span{background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:0 8px;font-size:.82rem}

/* evaluation */
.evalgrid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:18px}
.meta{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.92rem}
.meta dt{color:var(--muted)} .meta dd{margin:0}
audio{width:100%}
.err{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.err:last-child{border-bottom:0}
.pts{background:var(--warn-soft);color:var(--warn);border-radius:5px;padding:0 8px;font-size:.82rem;font-weight:600;white-space:nowrap}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.step button{background:var(--surface-2);border:0;width:32px;height:32px;font-size:1.1rem}
.step button:hover{background:var(--accent-soft)}
.step output{min-width:34px;text-align:center;font-weight:600}
.score{font-family:var(--f-display);font-size:2.6rem;font-weight:700;line-height:1}
textarea.inp{min-height:84px;resize:vertical}
.detail td{background:var(--surface-2)}
.chk{display:flex;align-items:center;gap:6px;white-space:nowrap;font-size:.88rem;cursor:pointer}
.qa{display:grid;gap:4px}
.btn.bad{background:var(--bad);border-color:var(--bad);color:var(--bg)}
.btn.sec.badt{color:var(--bad)}
.ico{display:inline-flex;align-items:center;justify-content:center;padding:4px 8px;position:relative}
.ico svg{display:block}
.ico.has{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.ico.has::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:6px;height:6px;border-radius:99px;background:var(--accent)}
.banner.ok{background:var(--good-soft);color:var(--good)}
.notice{display:flex;flex-wrap:wrap;gap:10px;align-items:center;border-radius:6px;padding:8px 12px;font-size:.92rem}
.notice.danger{background:var(--bad-soft);color:var(--bad)}
.notice.info{background:var(--accent-soft);color:var(--accent)}
.askdel{display:inline-flex;gap:6px;align-items:center;white-space:nowrap;font-size:.85rem;color:var(--bad)}
.tx{display:grid;gap:10px}
.tx-area{min-height:170px;line-height:1.9;resize:vertical}
.tx-status{font-size:.88rem;color:var(--muted)}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0);pointer-events:none}
#toast{position:fixed;inset-inline:0;bottom:max(18px,env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:20}
#toast span{background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:.9rem;opacity:0;transition:opacity .2s}
#toast.show span{opacity:1}

@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;border-inline-start:0;border-bottom:1px solid var(--line);padding:10px max(12px,env(safe-area-inset-left,0px));gap:8px}
  .rail nav{display:flex;overflow-x:auto;max-width:100%;order:3;width:100%}
  .nav-btn{white-space:nowrap}
  .who{margin-top:0;border-top:0;padding-top:0;margin-inline-start:auto;display:flex;align-items:center}
  .evalgrid{grid-template-columns:minmax(0,1fr)}
  .bar{grid-template-columns:100px minmax(0,1fr) 44px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="root" dir="rtl" lang="ar"></div>
<div id="toast"><span></span></div>
<input id="upOne" class="vh" type="file" accept="audio/*" tabindex="-1" aria-hidden="true">

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
try{document.documentElement.dir='rtl';document.documentElement.lang='ar'}catch(e){}

/* ---------- بيانات في الذاكرة فقط: تُمسح عند تحديث الصفحة ---------- */
const USERS={admin:{pass:'1234',role:'admin',name:'المدير'}};
const NAV={
  admin:[['calls','المكالمات'],['errors','قيم الأخطاء']]
};
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const daysAgo=n=>{const d=new Date();d.setDate(d.getDate()-n);return d};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtTime=t=>new Date(t).toLocaleString('ar-EG',{dateStyle:'short',timeStyle:'short'});

const S={user:null,view:'',calls:[],types:[],evals:{},log:[],sel:new Set(),cur:null,draft:{counts:{},notes:''},auto:true,
  f:{from:'',to:'',q:''},open:null,statusFilter:'all',sample:false};

function defaultTypes(){return[
  {id:'t1',name:'عدم الترحيب أو الختام الصحيح',points:5,active:true},
  {id:'t2',name:'عدم التحقق من هوية العميل',points:10,active:true},
  {id:'t3',name:'معلومة غير صحيحة للعميل',points:15,active:true},
  {id:'t4',name:'أسلوب غير لائق أو مقاطعة العميل',points:20,active:true},
  {id:'t5',name:'عدم حل المشكلة أو التصعيد الخاطئ',points:10,active:true},
  {id:'t6',name:'إطالة غير مبررة للمكالمة',points:5,active:true}]}
S.types=defaultTypes();S.rate=1;S.quick=null;S.qd={counts:{}};S.txLang='arabic';S.txModel='Xenova/whisper-base';S.loaded=false;

function loadSample(){
  const agents=['أحمد سمير','منى عادل','كريم حسن','سارة محمود','يوسف إبراهيم'];
  const durs=['04:32','06:10','03:45','09:02','05:18','02:57','07:40','04:05','06:51','03:22','08:15','05:44'];
  const calls=[];
  for(let i=0;i<12;i++){
    calls.push({id:'MQ-'+(1001+i),agent:agents[i%5],customer:'010'+(i*7%10)+'***'+(4100+i*37),date:ymd(daysAgo(7-Math.floor(i/2))),duration:durs[i],file:(i%3===1?'call_6400_':'call_')+(1001+i)+'.mp3',direction:(i%3===1?'وارد':'صادر'),audioUrl:'',status:'new'});
  }
  [8,9,10].forEach(i=>calls[i].status='assigned');
  S.calls=calls;
  const mk=(i,counts,notes,dAgo)=>{
    const c=calls[i];c.status='done';
    const errs=Object.entries(counts).map(([id,count])=>{const t=S.types.find(x=>x.id===id);return{id,name:t.name,points:t.points,count}});
    const score=Math.max(0,100-errs.reduce((s,e)=>s+e.points*e.count,0));
    S.evals[c.id]={callId:c.id,agent:c.agent,date:ymd(daysAgo(dAgo)),at:daysAgo(dAgo).getTime(),by:'المدير',errors:errs,notes,score};
  };
  mk(0,{t1:1},'مكالمة جيدة بشكل عام، الختام ناقص.',5);
  mk(1,{},'أداء ممتاز والتزام كامل بالنص.',5);
  mk(2,{t2:1,t6:1},'لم يتحقق من الهوية قبل شرح تفاصيل الحساب.',4);
  mk(3,{t3:1,t5:1},'أعطى موعد تجديد غير صحيح ولم يصعّد الشكوى.',3);
  mk(4,{t4:1},'قاطع العميل مرتين أثناء الشرح.',2);
  mk(5,{t1:1,t6:1},'',1);
  S.sample=true;
  addLog('تحميل بيانات تجريبية');
}

function addLog(action){S.log.unshift({at:Date.now(),user:S.user?S.user.name:'—',action});if(S.log.length>500)S.log.length=500;persist()}
function toast(m,ms){const t=document.getElementById('toast');t.firstElementChild.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),ms||2600)}
const pendingCalls=()=>S.calls.filter(c=>c.status==='assigned');
const scorePill=s=>s>=90?['ممتاز','p-good']:s>=75?['جيد','p-good']:s>=60?['مقبول','p-mid']:['ضعيف','p-bad'];
const statusPill=s=>s==='done'?['تم التقييم','p-done']:s==='assigned'?['مطلوب مراجعتها','p-assigned']:['جديدة','p-new'];

function evalsFiltered(useQ){
  const f=S.f;
  return Object.values(S.evals).filter(e=>(!f.from||e.date>=f.from)&&(!f.to||e.date<=f.to)&&(!useQ||!f.q||(e.agent+' '+e.callId+' '+e.notes).includes(f.q))).sort((a,b)=>b.at-a.at);
}
const avg=a=>a.length?Math.round(a.reduce((s,x)=>s+x,0)/a.length):0;

/* ---------- مشغّل مشترك للقائمة ---------- */
const player=new Audio();let playingId=null;
function playBtn(c){return`<button class="btn sm" data-act="play" data-play="${esc(c.id)}">${playingId===c.id&&!player.paused?'إيقاف':'تشغيل'}</button>`}
const fmtSec=t=>{t=Math.max(0,Math.floor(Number.isFinite(t)?t:0));return pad(Math.floor(t/60))+':'+pad(t%60)};
const timeText=()=>fmtSec(player.currentTime)+' / '+fmtSec(player.duration);
function playCtl(c){return`<div><div class="row" style="flex-wrap:nowrap;gap:4px">${playBtn(c)}<button class="btn sec sm" data-act="slower">أبطأ</button><span class="num" data-rate style="min-width:36px;text-align:center">${S.rate}×</span><button class="btn sec sm" data-act="faster">أسرع</button>${txBtn(c)}</div><div class="muted num" style="font-size:.8rem" data-time="${esc(c.id)}">${playingId===c.id?timeText():'—'}</div></div>`}
function setRate(d){const R=[0.5,0.75,1,1.25,1.5,2];let i=R.indexOf(S.rate);i=Math.min(R.length-1,Math.max(0,i+d));S.rate=R[i];player.defaultPlaybackRate=S.rate;player.playbackRate=S.rate;document.querySelectorAll('[data-rate]').forEach(el=>el.textContent=S.rate+'×')}
player.addEventListener('loadedmetadata',()=>{player.playbackRate=S.rate});
player.addEventListener('timeupdate',()=>{document.querySelectorAll('[data-time]').forEach(el=>{el.textContent=el.dataset.time===playingId?timeText():'—'})});
let _rt;function scheduleRender(){clearTimeout(_rt);_rt=setTimeout(()=>{if(S.user&&S.view==='calls')render()},400)}
function probeDuration(c){
  if(c.duration||!c.audioUrl||c._probed)return;c._probed=true;
  const a=new Audio();a.preload='metadata';a.src=c.audioUrl;
  a.addEventListener('loadedmetadata',()=>{if(Number.isFinite(a.duration)&&!c.duration){c.duration=fmtSec(a.duration);persist();scheduleRender()}});
}
function saveQuick(c,errs){
  const old=S.evals[c.id];
  const score=Math.max(0,100-errs.reduce((s,x)=>s+x.points*x.count,0));
  S.evals[c.id]={callId:c.id,agent:c.agent,date:ymd(new Date()),at:Date.now(),by:S.user.name,errors:errs,notes:old?old.notes:'',score};
  c.status='done';
  const n=errs.reduce((s,x)=>s+x.count,0);
  addLog(n?`تسجيل ${n} خطأ للمكالمة ${c.id} بدرجة ${score}`:`تقييم المكالمة ${c.id} بدون أخطاء (الدرجة 100)`);
}
function removeEval(c){delete S.evals[c.id];c.status='new';addLog(`إلغاء تقييم المكالمة ${c.id}`)}
function quickToggle(kind,id,on){
  const c=S.calls.find(x=>x.id===id);if(!c)return;
  const e=S.evals[id];
  if(kind==='ok'){
    S.quick=null;
    if(on){saveQuick(c,[]);toast('تم تسجيل المكالمة بدون أخطاء')}
    else if(e&&!e.errors.length){removeEval(c)}
  }else{
    if(on){S.qd={counts:{}};if(e)e.errors.forEach(x=>S.qd.counts[x.id]=x.count);S.quick=id}
    else{S.quick=null;if(e&&e.errors.length)removeEval(c)}
  }
  render();
}
function quickPanel(c){
  const act=S.types.filter(t=>t.active);
  return`<div><b>اختر نوع الخطأ</b>${act.map(t=>`<div class="err"><span>${esc(t.name)}</span><span class="pts num">−${t.points}</span><span class="step"><button type="button" data-act="qdec" data-t="${t.id}" aria-label="إنقاص">−</button><output id="qc-${t.id}" class="num">${S.qd.counts[t.id]||0}</output><button type="button" data-act="qinc" data-t="${t.id}" aria-label="زيادة">+</button></span></div>`).join('')}
  <div class="row" style="justify-content:space-between;margin-top:8px"><div>الدرجة: <b class="num" id="qscore">${qScore()}</b></div><div class="row"><button class="btn" data-act="qsave" data-id="${esc(c.id)}">حفظ</button><button class="btn sec" data-act="qcancel">إلغاء</button></div></div></div>`;
}
function qScore(){let d=0;S.types.forEach(t=>{d+=(S.qd.counts[t.id]||0)*t.points});return Math.max(0,100-d)}
function syncPlayBtns(){document.querySelectorAll('[data-play]').forEach(b=>{b.textContent=(b.dataset.play===playingId&&!player.paused)?'إيقاف':'تشغيل'})}
['play','pause','ended'].forEach(ev=>player.addEventListener(ev,syncPlayBtns));
function togglePlay(id){
  const c=S.calls.find(x=>x.id===id);if(!c||!c.audioUrl)return;
  if(playingId===id&&!player.paused){player.pause();return}
  if(playingId!==id){player.src=c.audioUrl;playingId=id}
  player.play().catch(()=>toast('تعذر تشغيل هذا الملف. قد تكون صيغته غير مدعومة في المتصفح.',5000));
}

/* ---------- التخزين الدائم على الجهاز (IndexedDB) ---------- */
const DL={save:async({filename,data})=>{const a=document.createElement('a');a.href=URL.createObjectURL(data);a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}};
const DB={db:null,ok:false};
function idbOpen(){return new Promise((res,rej)=>{
  const to=setTimeout(()=>rej(new Error('timeout')),4000);
  try{const r=indexedDB.open('memoq-v1',1);
    r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('kv');d.createObjectStore('audio')};
    r.onsuccess=()=>{clearTimeout(to);res(r.result)};
    r.onerror=()=>{clearTimeout(to);rej(r.error)};
    r.onblocked=()=>{clearTimeout(to);rej(new Error('blocked'))};
  }catch(e){clearTimeout(to);rej(e)}})}
function idbTx(stores,mode,fn){
  const t=DB.db.transaction(stores,mode);const r=fn(t);
  return new Promise((res,rej)=>{t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}
function snapshot(){
  return{v:1,session:S.user?'admin':null,savedAt:Date.now(),
    calls:S.calls.map(c=>{const{audioUrl,_probed,_blob,_blobSaved,...rest}=c;rest.hasAudio=!!c._blob;return rest}),
    evals:S.evals,types:S.types,log:S.log.slice(0,300),rate:S.rate,auto:S.auto,sample:S.sample};
}
let _pt;
function persist(){if(!DB.ok||!S.loaded)return;clearTimeout(_pt);_pt=setTimeout(flush,150)}
async function flush(){
  if(!DB.ok||!S.loaded)return;
  clearTimeout(_pt);
  try{const snap=snapshot();try{localStorage.setItem('memoq-state',JSON.stringify(snap))}catch(e){}await idbTx(['kv'],'readwrite',t=>t.objectStore('kv').put(snap,'state'))}
  catch(e){S.storeWarn='تعذر حفظ آخر التغييرات.';return}
  const pend=S.calls.filter(c=>c._blob&&!c._blobSaved);
  let failed=0;
  for(const c of pend){
    try{await idbTx(['audio'],'readwrite',t=>t.objectStore('audio').put({blob:c._blob,name:c._blob.name||c.file||'',type:c._blob.type||''},c.id));c._blobSaved=true}
    catch(e){c._blobSaved='fail';failed++}
  }
  if(failed){S.storeWarn=`تعذر حفظ ${failed} تسجيل بسبب امتلاء مساحة المتصفح. ستحتاج إلى رفعه مرة أخرى بعد تحديث الصفحة.`;if(S.user)render()}
}
async function initStore(){
  try{
    DB.db=await idbOpen();DB.ok=true;
    try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
    let st=await idbTx(['kv'],'readonly',t=>t.objectStore('kv').get('state'));
    try{const ls=JSON.parse(localStorage.getItem('memoq-state')||'null');if(ls&&(!st||(ls.savedAt||0)>(st.savedAt||0)))st=ls}catch(e){}
    if(st){
      S.calls=st.calls||[];S.evals=st.evals||{};
      S.types=(st.types&&st.types.length)?st.types:defaultTypes();
      S.log=st.log||[];if(st.session&&USERS[st.session])S.user=USERS[st.session];S.rate=st.rate||1;S.auto=st.auto!==false;S.sample=!!st.sample;
      player.defaultPlaybackRate=S.rate;
      for(const c of S.calls){
        if(!c.hasAudio)continue;
        try{
          const a=await idbTx(['audio'],'readonly',t=>t.objectStore('audio').get(c.id));
          if(a&&a.blob){c._blob=a.blob;c._blobSaved=true;c.audioUrl=URL.createObjectURL(a.blob)}
        }catch(e){}
      }
    }
  }catch(e){DB.ok=false}
  S.loaded=true;
  S.calls.forEach(probeDuration);
  render();
}
function attachAudio(c,f){
  if(c.audioUrl){try{URL.revokeObjectURL(c.audioUrl)}catch(e){}}
  c.audioUrl=URL.createObjectURL(f);c._blob=f;c._blobSaved=false;
}
window.addEventListener('pagehide',()=>{flush()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flush()});

/* ---------- حذف المكالمات مع إمكانية التراجع ---------- */
function finalizeUndo(noRender){
  if(!S.undo)return;
  clearTimeout(S.undo.t);
  S.undo.calls.forEach(c=>{if(c.audioUrl){try{URL.revokeObjectURL(c.audioUrl)}catch(e){}}});
  S.undo=null;
  if(!noRender&&S.user&&S.view==='calls')render();
}
function deleteCalls(idList){
  const ids=new Set(idList);
  const gone=S.calls.filter(c=>ids.has(c.id));
  if(!gone.length){S.delAsk=null;render();return}
  finalizeUndo(true);
  if(ids.has(playingId)){player.pause();playingId=null}
  if(T.run&&ids.has(T.run.id))stopAutoTx(true);
  const order=S.calls.map(c=>c.id);
  const evs={};
  gone.forEach(c=>{if(S.evals[c.id]){evs[c.id]=S.evals[c.id];delete S.evals[c.id]}});
  S.calls=S.calls.filter(c=>!ids.has(c.id));
  ids.forEach(id=>S.sel.delete(id));
  [['quick'],['openCall'],['txOpen'],['open'],['cur']].forEach(([k])=>{if(ids.has(S[k]))S[k]=null});
  S.delAsk=null;
  if(DB.ok)idbTx(['audio'],'readwrite',t=>{ids.forEach(id=>t.objectStore('audio').delete(id))}).catch(()=>{});
  S.undo={calls:gone,evals:evs,order,t:setTimeout(()=>finalizeUndo(),15000)};
  addLog(`حذف ${gone.length} مكالمة`+(gone.length===1?` (${gone[0].id})`:''));
  render();
}
function undoDelete(){
  const u=S.undo;if(!u)return;
  clearTimeout(u.t);S.undo=null;
  const have=new Set(S.calls.map(c=>c.id));
  u.calls.forEach(c=>{if(!have.has(c.id)){if(c._blob)c._blobSaved=false;S.calls.push(c)}});
  Object.assign(S.evals,u.evals);
  const ix=new Map(u.order.map((id,i)=>[id,i]));
  S.calls.sort((a,b)=>(ix.has(a.id)?ix.get(a.id):1e9)-(ix.has(b.id)?ix.get(b.id):1e9));
  addLog(`التراجع عن حذف ${u.calls.length} مكالمة`);
  render();toast('تمت استعادة المكالمات');
}

const T={run:null};

}
function txLive(c){return c.tx?c.tx.text:''}
function txPanel(c){

  return`<div class="tx"><div class="row" style="justify-content:space-between"><b>نص المكالمة <span class="muted num" dir="auto">${esc(c.file||"")}</span></b>${c.tx&&c.tx.at?`<span class="muted num" style="font-size:.82rem">آخر تعديل ${fmtTime(c.tx.at)}${c.tx.src==='auto'?' · تحويل تلقائي':c.tx.src==='import'?' · مستورد':''}</span>`:''}</div>
  <textarea class="inp tx-area" id="txa" data-txa="${esc(c.id)}" dir="auto" ${running?'readonly':''} placeholder="${c.audioUrl?'اضغط «تحويل إلى نص» أو الصق نص المكالمة هنا. أي تعديل يُحفظ تلقائيًا.':'الصق نص المكالمة هنا. أي تعديل يُحفظ تلقائيًا.'}">${esc(text)}</textarea>
  <div class="tx-status" id="txStatus" role="status">${esc(running?(S.txMsg||'جاري التحويل...'):(S.txMsgFor===c.id?S.txMsg:''))}</div>
  <div class="row">
    ${running?`<button class="btn bad sm" data-act="txstop">إيقاف التحويل</button>`

      :`<span class="tx-status">التحويل إلى نص غير متاح في هذا المتصفح. جرّب Chrome أو Edge حديثًا، أو الصق النص أو استورده من ملف.</span>`}
    <label class="btn sec sm" style="cursor:pointer;position:relative">استيراد من ملف نصي<input class="vh" type="file" accept=".txt,.srt,.vtt,.md,text/plain" data-txfile="${esc(c.id)}"></label>
    <button class="btn sec sm" data-act="txcopy" ${text?'':'disabled'}>نسخ</button>
    <button class="btn sec sm" data-act="txdl" data-id="${esc(c.id)}" ${text?'':'disabled'}>تنزيل TXT</button>
    <button class="btn sec sm badt" data-act="txdel" data-id="${esc(c.id)}" ${c.tx&&!running?'':'disabled'}>مسح النص</button>
  </div>
  ${auto&&!running?`<div class="tx-status">التحويل يتم على جهازك بنموذج Whisper ولا يُرفع الصوت إلى أي مكان. أول مرة يُحمَّل النموذج من الإنترنت (من 80 إلى 250 ميجابايت تقريبًا حسب الدقة) ثم يُحفظ في المتصفح. المكالمة الطويلة قد تستغرق عدة دقائق، فراجع النص بعد انتهائه.</div>`:''}
  </div>`;
}
function txSetStatus(m,id){S.txMsg=m;S.txMsgFor=id||S.txMsgFor;const el=document.getElementById('txStatus');if(el)el.textContent=m}
function txShowLive(){
  const r=T.run;if(!r)return;
  const c=S.calls.find(x=>x.id===r.id);const ta=document.getElementById('txa');
  if(c&&ta&&ta.dataset.txa===r.id){ta.value=txLive(c);ta.scrollTop=ta.scrollHeight}
}
const WHISPER_VER='3.5.2';
const WORKER_SRC=[
"import {pipeline,env} from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@"+WHISPER_VER+"';",
"env.allowLocalModels=false;",
"const pipes={};",
"self.onmessage=async e=>{",
"  const {id,model,audio,language}=e.data;",
"  try{",
"    if(!pipes[model]){",
"      const files={};",
"      pipes[model]=await pipeline('automatic-speech-recognition',model,{progress_callback:p=>{",
"        if(p&&p.status==='progress'&&p.file){files[p.file]=p;let l=0,t=0;for(const k in files){l+=files[k].loaded||0;t+=files[k].total||0}self.postMessage({id,type:'progress',pct:t?Math.round(l/t*100):0})}",
"      }});",
"    }",
"    self.postMessage({id,type:'working'});",
"    const out=await pipes[model](audio,{language,task:'transcribe',chunk_length_s:30,stride_length_s:5});",
"    self.postMessage({id,type:'done',text:(out.text||'').trim()});",
"  }catch(err){self.postMessage({id,type:'error',message:String((err&&err.message)||err)})}",
"};"].join('\n');
let _wk=null;
function getWorker(){if(_wk)return _wk;const url=URL.createObjectURL(new Blob([WORKER_SRC],{type:'text/javascript'}));_wk=new Worker(url,{type:'module'});return _wk}
function killWorker(){if(_wk){try{_wk.terminate()}catch(e){}_wk=null}}
async function decode16k(blob){
  const buf=await blob.arrayBuffer();
  const AC=window.AudioContext||window.webkitAudioContext;
  const ctx=new AC();
  let ab;try{ab=await ctx.decodeAudioData(buf)}finally{try{ctx.close()}catch(e){}}
  const off=new OfflineAudioContext(1,Math.max(1,Math.ceil(ab.duration*16000)),16000);
  const s=off.createBufferSource();s.buffer=ab;s.connect(off.destination);s.start();
  const out=await off.startRendering();
  return new Float32Array(out.getChannelData(0));
}
function stopAutoTx(silent){
  const r=T.run;if(!r)return;
  r.stopping=true;killWorker();T.run=null;
  if(!silent){S.txMsgFor=r.id;S.txMsg='تم إيقاف التحويل.';render()}
}
async function startAutoTx(id){
  const c=S.calls.find(x=>x.id===id);
  if(!c||!c._blob||!autoTxSupported())return;
  stopAutoTx(true);
  const run={id,stopping:false};T.run=run;S.txMsgFor=id;S.txMsg='جاري قراءة ملف الصوت...';render();
  const fail=m=>{if(T.run!==run)return;killWorker();T.run=null;S.txMsg=m;S.txMsgFor=id;render()};
  let audio;
  try{audio=await decode16k(c._blob)}catch(e){fail('تعذر قراءة هذا الملف الصوتي. قد تكون صيغته غير مدعومة في المتصفح.');return}
  if(T.run!==run)return;
  let w;
  try{w=getWorker()}catch(e){fail('هذا المتصفح لا يدعم تشغيل التحويل. جرّب Chrome أو Edge حديثًا.');return}
  w.onerror=()=>fail('تعذر تحميل نموذج التحويل. تحقق من الاتصال بالإنترنت، ومن أن الصفحة مفتوحة من رابط https وليس من ملف على الجهاز.');
  w.onmessage=ev=>{
    const m=ev.data;if(T.run!==run||m.id!==id)return;
    if(m.type==='progress')txSetStatus('جاري تحميل النموذج لأول مرة '+m.pct+'%',id);
    else if(m.type==='working')txSetStatus('جاري تحويل الصوت إلى نص. قد يستغرق ذلك عدة دقائق...',id);
    else if(m.type==='done'){
      T.run=null;S.txMsgFor=id;
      if(m.text){c.tx={text:m.text,at:Date.now(),src:'auto'};addLog('تحويل المكالمة '+c.id+' إلى نص');S.txMsg='تم حفظ النص. راجعه وعدّل ما يلزم.'}
      else S.txMsg='لم يُكتشف كلام في هذا التسجيل.';
      render();
    }
    else if(m.type==='error')fail('تعذر التحويل: '+m.message);
  };
  txSetStatus('جاري تجهيز النموذج...',id);
  w.postMessage({id,model:S.txModel,audio,language:S.txLang},[audio.buffer]);
}
function cleanSubtitle(s){
  return String(s).replace(/^﻿/,'').replace(/^WEBVTT.*$/m,'')
    .split(/\r?\n/).filter(l=>l.trim()&&!/^\d+$/.test(l.trim())&&!/^\d{1,2}:\d{2}(:\d{2})?[.,]\d{1,3}\s*-->/.test(l.trim())).join('\n').trim();
}

function currentCall(){
  const p=pendingCalls();
  if(!p.length)return null;
  let c=p.find(x=>x.id===S.cur);
  if(!c){c=p[0];S.cur=c.id;S.draft={counts:{},notes:''}}
  return c;
}
function calcScore(){
  let d=0;S.types.forEach(t=>{d+=(S.draft.counts[t.id]||0)*t.points});return Math.max(0,100-d)
}

/* ---------- الأحداث ---------- */
root.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='loginForm'){
    const u=document.getElementById('u').value.trim().toLowerCase(),p=document.getElementById('p').value;
    const acc=USERS[u];
    if(!acc||acc.pass!==p){document.getElementById('loginErr').textContent='اسم المستخدم أو كلمة المرور غير صحيحة. تأكد من الكتابة وحاول مرة أخرى.';return}
    S.user=acc;S.view='';addLog('تسجيل دخول');render();
  }
  if(e.target.id==='newType'){
    const n=document.getElementById('ntName').value.trim(),p=Number(document.getElementById('ntPts').value);
    if(!n)return;
    S.types.push({id:'t'+Date.now(),name:n,points:p,active:true});addLog(`إضافة نوع خطأ «${n}» بقيمة ${p}`);render();toast('تمت إضافة الخطأ');
  }
});

root.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;
  if(a==='fill'){document.getElementById('u').value=b.dataset.u;document.getElementById('p').value='1234';return}
  if(a==='nav'){S.view=b.dataset.v;S.open=null;render();return}
  if(a==='logout'){addLog('تسجيل خروج');S.user=null;render();return}
  if(a==='clearf'){S.f.from='';S.f.to='';render();return}
  if(a==='export'){exportXlsx(b.dataset.scope);return}
  if(a==='play'){togglePlay(b.dataset.play);return}
  if(a==='slower'){setRate(-1);return}
  if(a==='faster'){setRate(1);return}
  if(a==='qinc'||a==='qdec'){
    const id=b.dataset.t;S.qd.counts[id]=Math.max(0,(S.qd.counts[id]||0)+(a==='qinc'?1:-1));
    document.getElementById('qc-'+id).textContent=S.qd.counts[id];document.getElementById('qscore').textContent=qScore();return}
  if(a==='qcancel'){S.quick=null;render();return}
  if(a==='selall'){
    const list=S.calls.filter(c=>S.statusFilter==='all'||c.status===S.statusFilter);
    if(list.length&&list.every(c=>S.sel.has(c.id)))list.forEach(c=>S.sel.delete(c.id));else list.forEach(c=>S.sel.add(c.id));
    render();return}
  if(a==='delrow'){S.delAsk=b.dataset.id;render();return}

    'الدرجة':e?e.score:'','عدد الأخطاء':e?e.errors.reduce((a,x)=>a+x.count,0):'','تفاصيل الأخطاء':e?e.errors.map(x=>x.name+' × '+x.count).join('، '):'',
    'الملاحظات':e?e.notes:'','تاريخ التقييم':e?e.date:'','قيّمها':e?e.by:'','نص المكالمة':c.tx&&c.tx.text?c.tx.text.slice(0,32000):''}});

/* ---------- استيراد Excel وربط التسجيلات ---------- */
const ALIAS={
  id:['رقم المكالمة','رقم','المكالمة','id','call id','callid','call_id'],
  agent:['الموظف','اسم الموظف','موظف','agent','employee'],
  customer:['العميل','رقم العميل','customer','phone','الهاتف'],
  date:['التاريخ','تاريخ المكالمة','date'],
  duration:['المدة','مدة المكالمة','duration'],
  file:['ملف التسجيل','اسم الملف','التسجيل','file','recording','filename'],
  dir:['النوع','نوع المكالمة','الاتجاه','direction','type']
};
function pick(row,key){
  const keys=Object.keys(row);
  for(const a of ALIAS[key]){const k=keys.find(x=>String(x).trim().toLowerCase()===a);if(k!==undefined&&row[k]!=='')return row[k]}
  return'';
}
function toDate(v){
  if(v instanceof Date&&!isNaN(v)){const d=new Date(v.getTime()+12*3600*1000);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())}
  const t=String(v||'').trim();const m=t.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);
  return m?m[3]+'-'+pad(m[2])+'-'+pad(m[1]):t
}
function toDur(v){
  if(typeof v==='number'){const s=v<1?Math.round(v*86400):Math.round(v);return pad(Math.floor(s/60))+':'+pad(s%60)}
  if(v instanceof Date&&!isNaN(v)){const d=new Date(v.getTime());return pad(d.getUTCHours()*60+d.getUTCMinutes())+':'+pad(d.getUTCSeconds())}
  return String(v||'').trim()
}
async function importExcel(file){
  if(typeof XLSX==='undefined'){toast('تعذر تحميل مكتبة قراءة Excel. تحقق من الاتصال بالإنترنت وحاول مرة أخرى.');return}
  try{
    const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
    let added=0,skipped=0,noAgent=0;
    const have=new Set(S.calls.map(c=>c.id));
    let seq=S.calls.length+1001;
    rows.forEach(r=>{
      const agent=String(pick(r,'agent')).trim();
      if(!['id','agent','customer','date','file'].some(k=>String(pick(r,k)).trim())){noAgent++;return}
      let id=String(pick(r,'id')).trim();
      if(!id){while(have.has('MQ-'+seq))seq++;id='MQ-'+seq}
      if(have.has(id)){skipped++;return}
      have.add(id);
      S.calls.push({id,agent,customer:String(pick(r,'customer')).trim(),date:toDate(pick(r,'date')),duration:toDur(pick(r,'duration')),file:String(pick(r,'file')).trim(),direction:toDir(pick(r,'dir'),String(pick(r,'file')).trim()||id),audioUrl:'',status:'new'});
      added++;
    });
    addLog(`استيراد ملف Excel «${file.name}»: ${added} مكالمة جديدة`);
    S.msg=`تم استيراد ${added} مكالمة من «${file.name}»`+(skipped?`، وتخطي ${skipped} مكررة`:'')+(noAgent?`، و${noAgent} فارغة`:'');
    render();
    toast(`تم استيراد ${added} مكالمة`+(skipped?`، وتخطي ${skipped} مكررة`:'')+(noAgent?`، و${noAgent} فارغة`:''));
  }catch(err){toast('تعذر قراءة الملف. تأكد أنه ملف Excel أو CSV سليم.')}
}
const AUDIO_EXT={mp3:'audio/mpeg',wav:'audio/wav',m4a:'audio/mp4',ogg:'audio/ogg',oga:'audio/ogg',opus:'audio/ogg',aac:'audio/aac',flac:'audio/flac',wma:'audio/x-ms-wma',amr:'audio/amr',mp4:'audio/mp4',webm:'audio/webm'};
const extOf=n=>(String(n).split('.').pop()||'').toLowerCase();
const isAudio=f=>(f.type&&f.type.startsWith('audio/'))||!!AUDIO_EXT[extOf(f.name)];
async function openArchive(file){
  const ext=extOf(file.name);
  if(ext==='rar'){toast('لا يمكن فتح ملفات RAR داخل المتصفح. فك الضغط على جهازك (WinRAR مثلًا) ثم اختر المجلد بزر «اختيار مجلد تسجيلات»، أو أعد ضغطها بصيغة ZIP.',10000);return}
  if(typeof JSZip==='undefined'){toast('تعذر تحميل مكتبة فتح الملفات المضغوطة. تحقق من الاتصال بالإنترنت وحاول مرة أخرى.',5000);return}
  try{
    toast('جاري فتح الملف المضغوط، قد يستغرق ذلك وقتًا مع الملفات الكبيرة',60000);
    const zip=await JSZip.loadAsync(file);
    const entries=Object.values(zip.files).filter(z=>!z.dir&&!/(^|\/)(__MACOSX|\.)/.test(z.name)&&AUDIO_EXT[extOf(z.name)]);
    if(!entries.length){toast('لم أجد ملفات صوتية داخل الملف المضغوط',6000);return}
    const out=[];
    for(const z of entries){
      const base=z.name.split('/').pop();
      const blob=await z.async('blob');
      out.push(new File([blob],base,{type:AUDIO_EXT[extOf(base)]}));
    }
    linkAudio(out);
  }catch(err){toast('تعذر فتح الملف المضغوط. تأكد أنه ملف ZIP سليم.',6000)}
}
function dateFromFile(f){
  const m=String(f.name).match(/(?<!\d)(20\d{2})[-_.]?(0[1-9]|1[0-2])[-_.]?(0[1-9]|[12]\d|3[01])(?:(?!\d)|(?=\d{4,6}(?!\d)))/);
  if(m)return m[1]+'-'+m[2]+'-'+m[3];
  return f.lastModified?ymd(new Date(f.lastModified)):'';
}
const dirFromName=n=>String(n).includes('6400')?'وارد':'صادر';
function toDir(v,name){const t=String(v||'').trim().toLowerCase();if(t==='وارد'||t==='in'||t==='inbound')return'وارد';if(t==='صادر'||t==='out'||t==='outbound')return'صادر';return dirFromName(name)}
function phoneFromName(n){
  const m=String(n).match(/(?<!\d)(?:(?:\+|00)?20)?(0?1[0125]\d{8})(?!\d)/);
  if(!m)return'';
  return m[1].startsWith('0')?m[1]:'0'+m[1];
}
function linkAudio(files){
  const stem=n=>String(n).replace(/\.[^.]+$/,'').trim().toLowerCase();
  let linked=0,created=0,phones=0;
  files.forEach(f=>{
    const sm=stem(f.name);
    const c=S.calls.find(c=>stem(c.file)===sm||String(c.id).toLowerCase()===sm);
    const url=URL.createObjectURL(f);
    const ph=phoneFromName(f.name),cd=dateFromFile(f),dr=dirFromName(f.name);
    if(c){if(c.audioUrl){try{URL.revokeObjectURL(c.audioUrl)}catch(e){}}c.audioUrl=url;c._blob=f;c._blobSaved=false;if(!c.file)c.file=f.name;if(!c.customer&&ph){c.customer=ph;phones++}if(!c.date&&cd)c.date=cd;if(!c.direction)c.direction=dr;linked++}
    else{
      let id=f.name.replace(/\.[^.]+$/,'').trim()||('MQ-'+(1001+S.calls.length));
      while(S.calls.some(x=>x.id===id))id+='_';
      S.calls.push({id,agent:'',customer:ph,date:cd,duration:'',file:f.name,direction:dr,audioUrl:url,_blob:f,_blobSaved:false,status:'new'});created++;if(ph)phones++;
    }
  });
  const msg=`تم ربط ${linked} تسجيل بمكالمات موجودة، وإنشاء ${created} مكالمة جديدة من ملفات لم تطابق أي مكالمة`+(phones?`. واستُخرج ${phones} رقم عميل من أسماء الملفات.`:'. لم أجد رقم عميل في أسماء الملفات.');
  S.msg=msg;addLog(`رفع ${files.length} ملف صوتي: ${msg}`);S.calls.forEach(probeDuration);
  render();toast(msg,6000);
}

initStore();
</script>
